# Include inside Nginx's http context. Only this virtual host uses these names.
# Query strings and request bodies are intentionally absent from access logs.
map $uri $ravoq_path {
    ~^/api/auth/ /api/auth/[redacted];
    ~^/(uz|ru|en)/invite/ /invite/[redacted];
    ~^/q/ /q/[redacted];
    default $uri;
}
log_format ravoq_safe '$time_iso8601 $request_method $ravoq_path $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=ravoq_requests:10m rate=15r/s;

server {
    listen 80;
    server_name resmen.loyiham.uz;
    access_log /var/log/nginx/ravoq.access.log ravoq_safe;
    location /.well-known/acme-challenge/ { root /var/www/ravoq-acme; }
    location / { return 301 https://resmen.loyiham.uz$request_uri; }
}
server {
    listen 443 ssl;
    server_name resmen.loyiham.uz;
    ssl_certificate /etc/letsencrypt/live/resmen.loyiham.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resmen.loyiham.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ravoq.access.log ravoq_safe;
    error_log /var/log/nginx/ravoq.error.log crit;
    client_max_body_size 9m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_req zone=ravoq_requests burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host resmen.loyiham.uz;
        proxy_set_header X-Forwarded-Host resmen.loyiham.uz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
